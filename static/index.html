<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日常待办</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- 飘落花瓣 -->
  <div id="petals" class="petals" aria-hidden="true"></div>

  <!-- 顶部横幅 -->
  <header class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">日常待办</h1>
      <p class="hero-subtitle">把每一天都过得可爱又充实 ✿</p>
    </div>
    <!-- 可爱装饰 -->
    <div class="star star1">♡</div>
    <div class="star star2">❀</div>
    <div class="star star3">✿</div>
  </header>

  <main class="page">

    <!-- ============ 登录 / 注册视图 ============ -->
    <section id="view-auth" class="view auth-view">
      <!-- 表单卡片 -->
      <div class="card auth-card">
        <div class="auth-avatar-wrap">
          <img src="/static/images/yae_miko.jpg" alt="头像" class="auth-avatar">
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="auth-form">
          <h2 class="auth-title">欢迎回来 ♡</h2>
          <label class="field">
            <span class="field-label">用户名</span>
            <input type="text" name="username" id="loginUsername" required autocomplete="username" placeholder="请输入用户名">
          </label>
          <label class="field">
            <span class="field-label">密码</span>
            <input type="password" name="password" id="loginPassword" required autocomplete="current-password" placeholder="请输入密码">
          </label>
          <div id="loginMsg" class="msg"></div>
          <button type="submit" class="btn btn-primary btn-block">登 录</button>
          <p class="auth-switch">还没有账号？<a href="#" id="goRegister">注册一个</a></p>
        </form>

        <!-- 注册表单 -->
        <form id="registerForm" class="auth-form hidden">
          <h2 class="auth-title">开启可爱一天 ✧</h2>
          <label class="field">
            <span class="field-label">用户名</span>
            <input type="text" name="username" id="regUsername" required autocomplete="username" placeholder="设置用户名">
          </label>
          <label class="field">
            <span class="field-label">密码</span>
            <input type="password" name="password" id="regPassword" required autocomplete="new-password" placeholder="设置密码（最多72字节）">
          </label>
          <div id="registerMsg" class="msg"></div>
          <button type="submit" class="btn btn-primary btn-block">注 册</button>
          <p class="auth-switch">已有账号？<a href="#" id="goLogin">去登录</a></p>
        </form>
      </div>
    </section>

    <!-- ============ 待办视图 ============ -->
    <section id="view-todo" class="view todo-view hidden">
      <!-- 顶部用户栏 -->
      <div class="todo-topbar card">
        <div class="user-info">
          <img src="/static/images/yae_miko.jpg" alt="头像" class="user-avatar">
          <span class="user-name" id="currentUser">未知旅行者</span>
        </div>
        <button class="btn btn-ghost" id="logoutBtn">退出登录</button>
      </div>

      <!-- 新建待办 -->
      <div class="card todo-create">
        <form id="createForm" class="create-form">
          <input type="text" id="createTitle" class="input" placeholder="今天要做些什么呀…" required maxlength="200">
          <input type="text" id="createDesc" class="input" placeholder="描述（可选）" maxlength="500">
          <button type="submit" class="btn btn-primary">添加</button>
        </form>
      </div>

      <!-- 待办列表 -->
      <div class="card todo-list-card">
        <div class="todo-list-head">
          <span class="todo-list-title">今日待办</span>
          <button class="btn btn-ghost btn-sm" id="clearBtn">清空全部</button>
        </div>
        <ul id="todoList" class="todo-list"></ul>
        <div id="todoEmpty" class="empty hidden">还没有待办，添加一个吧 ✦</div>
        <div id="pagination" class="pagination"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p class="footer-title">日常待办</p>
    <img src="/static/images/footer_icons.jpg" alt="七元素" class="footer-img" loading="lazy">
  </footer>

  <!-- 边框透明度调节滑块 -->
  <div class="glass-control" id="glassControl">
    <label class="gc-label" for="borderAlpha">边框透明度</label>
    <input type="range" id="borderAlpha" min="0" max="0.8" step="0.05" value="0.35">
    <span class="gc-val" id="borderAlphaVal">35%</span>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
